  <button

    aria-label="Toggle navigation"

    <span></span>

  <nav class="header__nav" [class.header__nav--open]="menuOpen()" aria-label="Main navigation">

    <a routerLink="/" fragment="capabilities" (click)="closeMenu()">Capabilities</a>
    <a routerLink="/" fragment="work" (click)="closeMenu()">Work</a>
    <a routerLink="/" fragment="system" (click)="closeMenu()">System</a>
    <a routerLink="/" fragment="journey" (click)="closeMenu()">Journey</a>
    <a routerLink="/" fragment="about" (click)="closeMenu()">About</a>

  </nav>
</header>

<main>
  <router-outlet />
</main>
